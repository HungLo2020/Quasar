[package]
name = "quasar-render-3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["vulkan"]
vulkan = ["vulkanic-gal/vulkan"]
opengl = ["vulkanic-gal/opengl"]
wgpu = ["vulkanic-gal/wgpu"]
visibility = ["dep:quasar-spatial"]
config = ["dep:quasar-config"]
diagnostics = ["dep:quasar-diagnostics"]

[dependencies]
vulkanic-gal = { workspace = true }
quasar-spatial = { workspace = true, optional = true }
quasar-config = { workspace = true, optional = true }
quasar-diagnostics = { workspace = true, optional = true }

[dev-dependencies]
quasar-frame = { workspace = true, features = ["vulkan"] }
quasar-render-2d = { workspace = true, features = ["gpu", "vulkan"] }
