[package]
name = "quasar-render-3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["native"]
vulkan = ["vulkanic-gal/vulkan"]
gles = ["vulkanic-gal/gles"]
metal = ["vulkanic-gal/metal"]
dx12 = ["vulkanic-gal/dx12"]
native = ["vulkanic-gal/vulkan", "vulkanic-gal/metal", "vulkanic-gal/dx12", "vulkanic-gal/gles"]
model-assets = ["dep:quasar-assets"]
visibility = ["dep:quasar-spatial"]
config = ["dep:quasar-config"]
diagnostics = ["dep:quasar-diagnostics"]

[dependencies]
quasar-frame.workspace = true
quasar-assets = { workspace = true, optional = true, features = ["model"] }
vulkanic-gal = { workspace = true }
quasar-spatial = { workspace = true, optional = true }
quasar-config = { workspace = true, optional = true }
quasar-diagnostics = { workspace = true, optional = true }

[dev-dependencies]
quasar-frame = { workspace = true, features = ["vulkan"] }
quasar-render-2d = { workspace = true, features = ["gpu", "vulkan"] }
