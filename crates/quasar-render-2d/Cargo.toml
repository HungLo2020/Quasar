[package]
name = "quasar-render-2d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["gpu", "vulkan"]
gpu = ["dep:vulkanic-gal", "dep:quasar-frame"]
vulkan = ["dep:raw-window-handle", "vulkanic-gal/vulkan"]
opengl = ["vulkanic-gal/opengl"]
png = ["dep:png"]
text = ["dep:quasar-text", "gpu"]

[dependencies]
quasar-core.workspace = true
quasar-text = { workspace = true, optional = true }
quasar-frame = { workspace = true, optional = true }
vulkanic-gal = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
png = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
