[package]
name = "quasar-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
model = []
gltf = ["model", "dep:gltf", "dep:image", "dep:base64", "dep:percent-encoding"]
serde = ["dep:serde"]
storage = ["dep:quasar-storage"]
diagnostics = ["dep:quasar-diagnostics"]
async = []
hot-reload = ["async", "dep:notify"]

[dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extensions", "KHR_materials_unlit", "KHR_texture_transform"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
base64 = { version = "0.22", optional = true }
percent-encoding = { version = "2", optional = true }
serde = { workspace = true, optional = true }
quasar-storage = { workspace = true, optional = true }
quasar-diagnostics = { workspace = true, optional = true }
notify = { version = "8.2", optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[[example]]
name = "async_benchmark"
required-features = ["async"]
