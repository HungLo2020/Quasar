[package]
name = "quasar-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["dim2", "dynamics", "events"]
dim2 = ["dep:rapier2d"]
dim3 = ["dep:rapier3d"]
dynamics = []
events = []
model-assets = ["dim3", "dep:quasar-assets", "quasar-assets/model"]
spatial = ["dep:quasar-spatial"]
enhanced-determinism = [
  "rapier2d?/enhanced-determinism",
  "rapier3d?/enhanced-determinism",
]

[dependencies]
quasar-assets = { workspace = true, optional = true }
quasar-spatial = { workspace = true, optional = true }
rapier2d = { version = "0.36.1", optional = true }
rapier3d = { version = "0.36.1", optional = true }

[dev-dependencies]
proptest = "1"

[[example]]
name = "physics_benchmark"
path = "examples/physics_benchmark.rs"
