[package]
name = "vulkanic-gal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl"] }

[features]
default = ["vulkan", "metal", "dx12", "gles"]
vulkan = ["wgpu/vulkan"]
metal = ["wgpu/metal"]
dx12 = ["wgpu/dx12"]
gles = ["wgpu/gles"]
webgpu = ["wgpu/webgpu"]
webgl = ["wgpu/webgl"]
spirv = ["wgpu/spirv"]
glsl = ["wgpu/glsl"]
naga-ir = ["wgpu/naga-ir"]
counters = ["wgpu/counters"]
trace = ["wgpu/trace"]
