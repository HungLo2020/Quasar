[package]
name = "vulkanic-gal"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
ash-window = "0.13"
raw-window-handle.workspace = true
glow = "0.18"
libloading = "0.8"
libc = "0.2"
shaderc = { version = "0.10.1", features = ["build-from-source"] }
smallvec = "1.15.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tracy-client = { version = "0.18.4", default-features = false, features = ["enable", "manual-lifetime", "only-localhost"], optional = true }

[dev-dependencies]
winit.workspace = true

[features]
tracy = ["dep:tracy-client"]
