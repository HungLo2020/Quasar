[package]
name = "quasar-nav"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
jobs = ["dep:quasar-jobs"]
spatial = ["dep:quasar-spatial"]
tilemap = ["dep:quasar-tilemap"]
navmesh = ["dep:navmesh"]

[dependencies]
navmesh = { version = "0.12.1", optional = true }
quasar-jobs = { workspace = true, optional = true }
quasar-spatial = { workspace = true, optional = true }
quasar-tilemap = { path = "../quasar-tilemap", optional = true, default-features = false }

[dev-dependencies]
proptest = "1"

[[example]]
name = "nav_benchmark"
path = "examples/nav_benchmark.rs"
