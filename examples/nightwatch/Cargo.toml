[package]
name = "nightwatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["desktop"]
graphics = ["quasar-physics/model-assets", "dep:quasar-assets", "dep:quasar-frame", "dep:quasar-render-3d", "dep:quasar-render-2d", "dep:vulkanic-gal", "quasar-profile/frame", "quasar-profile/json", "quasar-profile/diagnostics"]
desktop = ["graphics", "dep:quasar-app", "quasar-app/desktop", "dep:quasar-window", "dep:quasar-input", "dep:quasar-core", "dep:quasar-audio"]

[dependencies]
quasar-assets = { workspace = true, optional = true, features = ["gltf", "diagnostics"] }
quasar-nav = { workspace = true, features = ["physics3d"] }
quasar-physics = { workspace = true, features = ["dim3"] }
quasar-config = { workspace = true, features = ["toml", "json"] }
quasar-diagnostics.workspace = true
quasar-frame = { workspace = true, optional = true, features = ["vulkan"] }
quasar-render-3d = { workspace = true, optional = true, features = ["visibility", "config", "diagnostics", "model-assets"] }
quasar-render-2d = { workspace = true, optional = true, features = ["gpu", "vulkan", "png"] }
vulkanic-gal = { workspace = true, optional = true, features = ["vulkan"] }
quasar-profile = { workspace = true, features = ["config"] }
quasar-app = { workspace = true, optional = true }
quasar-window = { workspace = true, optional = true }
quasar-input = { workspace = true, optional = true }
quasar-core = { workspace = true, optional = true }
quasar-audio = { workspace = true, optional = true, features = ["native"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
