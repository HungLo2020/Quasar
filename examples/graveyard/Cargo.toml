[package]
name = "graveyard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "A walkable foggy graveyard: height fog, lantern scattering, drifting mist and a cookie flashlight"

[features]
default = ["desktop"]
desktop = ["dep:quasar-window", "quasar-app/desktop"]

[dependencies]
quasar-app.workspace = true
quasar-core.workspace = true
quasar-frame = { workspace = true, features = ["vulkan"] }
quasar-input.workspace = true
quasar-render-3d.workspace = true
quasar-window = { workspace = true, optional = true }
png.workspace = true
vulkanic-gal = { workspace = true, features = ["vulkan"] }

[[bin]]
name = "graveyard"
path = "src/main.rs"
