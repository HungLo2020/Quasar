[package]
name = "starfall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["desktop"]
desktop = [
  "dep:quasar-window",
  "quasar-app/desktop",
  "quasar-audio/native",
  "quasar-window/diagnostics",
]

[dependencies]
quasar-app.workspace = true
quasar-assets = { workspace = true, features = ["diagnostics"] }
quasar-audio = { workspace = true, features = ["diagnostics"] }
quasar-config = { workspace = true, features = ["toml", "json"] }
quasar-core.workspace = true
quasar-diagnostics = { workspace = true, features = ["timing"] }
quasar-frame = { workspace = true, features = ["vulkan", "diagnostics"] }
quasar-input.workspace = true
quasar-jobs = { workspace = true, features = ["diagnostics"] }
quasar-profile = { workspace = true, features = ["json", "frame"] }
quasar-render-2d = { workspace = true, features = ["gpu", "vulkan"] }
quasar-render-3d.workspace = true
quasar-sim = { workspace = true, features = ["serde"] }
quasar-window = { workspace = true, optional = true }
png.workspace = true
serde.workspace = true
serde_json.workspace = true
vulkanic-gal = { workspace = true, features = ["vulkan"] }

[[bin]]
name = "starfall"
path = "src/main.rs"


[dev-dependencies]
tempfile.workspace = true
