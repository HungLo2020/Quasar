[package]
name = "app-stress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[features]
default = ["desktop"]
desktop = ["quasar-app/desktop", "quasar-render-2d/gpu", "quasar-render-2d/native"]

[dependencies]
quasar-app = { workspace = true, default-features = false }
quasar-core.workspace = true
quasar-input.workspace = true
quasar-jobs.workspace = true
quasar-render-2d = { workspace = true, default-features = false }
quasar-window.workspace = true

[[bin]]
name = "app-stress"
path = "src/main.rs"
required-features = ["desktop"]
