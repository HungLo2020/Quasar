[workspace]
members = ["crates/*", "examples/pong", "examples/composition", "examples/tilequest", "examples/framebuffer", "examples/audio", "examples/starfall", "examples/falling-sand", "examples/physics-playground", "examples/app-stress"]
default-members = ["examples/pong"]
resolver = "3"

[workspace.package]
version = "0.2.15"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
quasar-tilemap = { path = "crates/quasar-tilemap" }
quasar-frame = { path = "crates/quasar-frame" }
quasar-render-3d = { path = "crates/quasar-render-3d" }
quasar-render-2d = { path = "crates/quasar-render-2d", default-features = false }
quasar-input = { path = "crates/quasar-input" }
quasar-jobs = { path = "crates/quasar-jobs" }
quasar-profile = { path = "crates/quasar-profile", default-features = false }
quasar-sim = { path = "crates/quasar-sim", default-features = false }
quasar-spatial = { path = "crates/quasar-spatial", default-features = false }
quasar-physics = { path = "crates/quasar-physics", default-features = false }
quasar-animation = { path = "crates/quasar-animation", default-features = false }
quasar-ui = { path = "crates/quasar-ui", default-features = false }
quasar-text = { path = "crates/quasar-text", default-features = false }
quasar-nav = { path = "crates/quasar-nav", default-features = false }
quasar-window = { path = "crates/quasar-window" }
quasar-audio = { path = "crates/quasar-audio", default-features = false }
quasar-app = { path = "crates/quasar-app", default-features = false }
quasar-config = { path = "crates/quasar-config", default-features = false }
quasar-assets = { path = "crates/quasar-assets", default-features = false }
quasar-core = { path = "crates/quasar-core" }
quasar-diagnostics = { path = "crates/quasar-diagnostics", default-features = false }
quasar-storage = { path = "crates/quasar-storage" }
vulkanic-gal = { path = "crates/vulkanic-gal", default-features = false }
winit = "0.30.13"
raw-window-handle = "0.6.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
png = "0.17"
tempfile = "3.27"

[profile.dev.package.shaderc-sys]
opt-level = 3

[profile.release]
lto = "thin"
