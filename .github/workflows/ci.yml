name: Check
# A last-ditch catch for breakage, not the release gate: the update-and-push
# skill runs the local checks and tools/full_checks.py (feature matrix, GPU,
# native X11, demos, docs). Keeps no caches or artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libasound2-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libvulkan-dev libudev-dev
      - run: cargo fmt --all -- --check
      # GPU tests report an environment gap and skip on the runner.
      - run: cargo test --workspace --locked
  platforms:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked -p quasar-window -p quasar-app -p quasar-input --all-targets --all-features
      - run: cargo check --locked -p quasar-audio --all-features

      - run: cargo check --locked -p vulkanic-gal -p quasar-frame -p quasar-render-2d -p quasar-render-3d --all-targets --all-features
      - run: cargo check --locked -p nightwatch -p starfall -p falling-sand -p physics-playground -p pong -p tilequest -p quasar-composition -p framebuffer -p app-stress --all-targets
