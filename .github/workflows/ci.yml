name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  headless:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libudev for the optional native gamepad check
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo check --locked -p quasar-window --all-targets
      - run: cargo check --locked -p quasar-app --all-targets
      - run: cargo check --locked -p quasar-app --no-default-features --all-targets
      - run: cargo check --locked -p quasar-jobs --all-targets
      - run: cargo check --locked -p quasar-jobs --no-default-features --all-targets
      - run: cargo check --locked -p quasar-sim --all-targets
      - run: cargo check --locked -p quasar-sim --no-default-features --all-targets
      - run: cargo check --locked -p quasar-sim --all-targets --features serde,jobs
      - run: cargo check --locked -p quasar-sim --all-targets --features serde
      - run: cargo check --locked -p quasar-sim --all-targets --features jobs
      - run: cargo check --locked -p quasar-config --all-targets
      - run: cargo check --locked -p quasar-config --no-default-features --all-targets
      - run: cargo check --locked -p quasar-config --no-default-features --all-targets --features toml
      - run: cargo check --locked -p quasar-config --no-default-features --all-targets --features json
      - run: cargo check --locked -p quasar-config --all-targets --features storage
      - run: cargo check --locked -p quasar-profile --all-targets
      - run: cargo check --locked -p quasar-profile --no-default-features --all-targets
      - run: cargo check --locked -p quasar-spatial --all-targets
      - run: cargo check --locked -p quasar-physics --all-targets
      - run: cargo check --locked -p quasar-physics --no-default-features --all-targets
      - run: cargo check --locked -p quasar-physics --no-default-features --features dim2 --all-targets
      - run: cargo check --locked -p quasar-physics --no-default-features --features dim3 --all-targets
      - run: cargo check --locked -p quasar-animation --all-targets
      - run: cargo check --locked -p quasar-animation --no-default-features --all-targets
      - run: cargo check --locked -p quasar-animation --features serde,sprite --all-targets
      - run: cargo check --locked -p quasar-nav --all-targets
      - run: cargo check --locked -p quasar-nav --no-default-features --all-targets
      - run: cargo check --locked -p quasar-nav --all-features --all-targets
      - run: cargo check --locked -p quasar-ui --lib
      - run: cargo check --locked -p quasar-ui --lib --no-default-features
      - run: cargo check --locked -p quasar-ui --lib --features input,config,serde
      - run: cargo check --locked -p quasar-ui --lib --features text
      - run: cargo check --locked -p quasar-text --lib
      - run: cargo check --locked -p quasar-text --lib --no-default-features
      - run: cargo check --locked -p quasar-text --lib --features serde
      - run: cargo check --locked -p quasar-input --features gilrs
      - run: cargo check --locked -p quasar-assets --features serde,storage
      - run: cargo check --locked -p quasar-assets --features async,hot-reload
      - run: cargo check --locked -p quasar-diagnostics --features timing,serde
      - run: cargo test --locked -p quasar-input -p pong -p quasar-tilemap -p tilequest -p quasar-audio --no-default-features
      - run: cargo test --locked -p quasar-audio --no-default-features --features settings --test settings
      - run: cargo test --locked -p quasar-workspace-checks
      - run: python tools/verify_pong.py
      - run: python tools/verify_tilemap.py
  audio-native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA headers on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - run: cargo check --locked -p quasar-audio --all-features
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libxkbcommon-dev libxkbcommon-x11-0 libasound2-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libvulkan-dev xvfb x11-utils xdotool libudev-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - name: Test optional feature layers
        run: |
          cargo test --locked -p quasar-input --features gilrs,diagnostics
          cargo test --locked -p quasar-assets --features serde,storage,diagnostics
          cargo test --locked -p quasar-assets --features async,hot-reload,serde,storage,diagnostics
          cargo test --locked -p quasar-diagnostics --features timing,serde
          cargo test --locked -p quasar-app
          cargo test --locked -p quasar-app --no-default-features
          cargo test --locked -p quasar-jobs
          cargo test --locked -p quasar-jobs --features diagnostics
          cargo test --locked -p quasar-sim
          cargo test --locked -p quasar-sim --features serde,jobs
          cargo test --locked -p quasar-config
          cargo test --locked -p quasar-config --no-default-features
          cargo test --locked -p quasar-config --features storage
          cargo test --locked -p quasar-config --no-default-features --features toml
          cargo test --locked -p quasar-config --no-default-features --features json
          cargo test --locked -p quasar-profile
          cargo test --locked -p quasar-profile --no-default-features
          cargo test --locked -p quasar-spatial
          cargo test --locked -p quasar-physics
          cargo test --locked -p quasar-physics --features dim3
          cargo test --locked -p quasar-physics --no-default-features --features dim2
          cargo test --locked -p quasar-physics --no-default-features --features dim3
          cargo test --locked -p quasar-physics --no-default-features --features dim2,dynamics
          cargo test --locked -p quasar-physics --no-default-features --features dim2,dim3,dynamics,spatial
          cargo test --locked -p quasar-animation
          cargo test --locked -p quasar-animation --all-features
          cargo test --locked -p quasar-nav
          cargo test --locked -p quasar-nav --all-features
          cargo test --locked -p quasar-ui
          cargo test --locked -p quasar-ui --no-default-features
          cargo test --locked -p quasar-ui --all-features
          cargo test --locked -p quasar-ui --features input
          cargo test --locked -p quasar-ui --features config
          cargo test --locked -p quasar-ui --features text
          cargo test --locked -p quasar-ui --features text-render2d
          cargo test --locked -p quasar-render-2d --features text
          cargo test --locked -p quasar-text
          cargo test --locked -p quasar-text --no-default-features
          cargo test --locked -p quasar-text --features serde
          cargo test --locked -p starfall
          cargo test --locked -p starfall --no-default-features
          cargo test --locked -p falling-sand
          cargo test --locked -p falling-sand --no-default-features
          cargo test --locked -p physics-playground
          cargo test --locked -p physics-playground --no-default-features
          cargo check --locked -p quasar-window --features diagnostics
          cargo check --locked -p quasar-audio --features diagnostics
          cargo check --locked -p quasar-frame --features diagnostics
          cargo clippy --locked -p quasar-input --all-targets --features gilrs,diagnostics -- -D warnings
          cargo clippy --locked -p quasar-assets --all-targets --features async,hot-reload,serde,storage,diagnostics -- -D warnings
          cargo clippy --locked -p quasar-diagnostics --all-targets --features timing,serde -- -D warnings
          cargo clippy --locked -p quasar-app --all-targets -- -D warnings
          cargo clippy --locked -p quasar-app --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-jobs --all-targets -- -D warnings
          cargo clippy --locked -p quasar-jobs --all-targets --features diagnostics -- -D warnings
          cargo clippy --locked -p quasar-sim --all-targets -- -D warnings
          cargo clippy --locked -p quasar-sim --all-targets --features serde,jobs -- -D warnings
          cargo clippy --locked -p quasar-config --all-targets -- -D warnings
          cargo clippy --locked -p quasar-config --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-config --all-targets --features storage -- -D warnings
          cargo clippy --locked -p quasar-config --all-targets --no-default-features --features toml -- -D warnings
          cargo clippy --locked -p quasar-config --all-targets --no-default-features --features json -- -D warnings
          cargo clippy --locked -p quasar-profile --all-targets -- -D warnings
          cargo clippy --locked -p quasar-profile --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-spatial --all-targets -- -D warnings
          cargo clippy --locked -p quasar-physics --all-targets -- -D warnings
          cargo clippy --locked -p quasar-physics --all-targets --features dim3 -- -D warnings
          cargo clippy --locked -p quasar-physics --all-targets --all-features -- -D warnings
          cargo clippy --locked -p quasar-physics --all-targets --no-default-features --features dim2 -- -D warnings
          cargo clippy --locked -p quasar-physics --all-targets --no-default-features --features dim3,spatial -- -D warnings
          cargo clippy --locked -p quasar-physics --all-targets --no-default-features --features dim2,dim3,dynamics,spatial -- -D warnings
          cargo clippy --locked -p quasar-animation --all-targets --all-features -- -D warnings
          cargo clippy --locked -p quasar-animation --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-nav --all-targets --all-features -- -D warnings
          cargo clippy --locked -p quasar-nav --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-ui --all-targets --all-features -- -D warnings
          cargo clippy --locked -p quasar-ui --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-text --all-targets --all-features -- -D warnings
          cargo clippy --locked -p quasar-text --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-render-2d --all-targets --features text -- -D warnings
          cargo clippy --locked -p starfall --all-targets -- -D warnings
          cargo clippy --locked -p starfall --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p falling-sand --all-targets -- -D warnings
          cargo clippy --locked -p falling-sand --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p physics-playground --all-targets -- -D warnings
          cargo clippy --locked -p physics-playground --all-targets --no-default-features -- -D warnings
      - name: Run native X11 identity and resize tests
        run: |
          xvfb-run -a sh -c 'QUASAR_X11_TESTS=1 cargo test --locked -p quasar-window --test x11_native -- --test-threads=1'
          xvfb-run -a sh -c 'QUASAR_X11_TESTS=1 cargo test --locked -p quasar-window --features diagnostics --test x11_native -- --test-threads=1'
      - name: Verify native X11 properties with xprop and xdotool
        run: |
          cargo build --locked -p quasar-window --example desktop_identity
          xvfb-run -a python3 tools/x11_window_smoke.py --timeout 15
          xvfb-run -a python3 tools/x11_window_smoke.py --transparent --timeout 15
      - name: Verify DPI-scaled physical metadata
        run: |
          xvfb-run -a env WINIT_X11_SCALE_FACTOR=2 QUASAR_X11_TESTS=1 cargo test --locked -p quasar-window --test x11_native -- --test-threads=1
          xvfb-run -a env WINIT_X11_SCALE_FACTOR=2 python3 tools/x11_window_smoke.py --timeout 15
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p quasar-audio --all-targets --all-features --locked -- -D warnings
      - name: Check backend feature separation
        run: |
          cargo check --locked -p vulkanic-gal --no-default-features
          cargo check --locked -p vulkanic-gal --no-default-features --features vulkan
          cargo check --locked -p vulkanic-gal --no-default-features --features opengl
          cargo check --locked -p vulkanic-gal --no-default-features --features wgpu
          cargo check --locked -p vulkanic-gal --no-default-features --features test-support
          cargo check --locked -p quasar-frame --no-default-features
          cargo check --locked -p quasar-render-2d --no-default-features --features gpu
          cargo check --locked -p quasar-render-2d --no-default-features --features gpu,vulkan
          cargo check --locked -p quasar-render-2d --no-default-features --features gpu,opengl
          cargo check --locked -p quasar-render-2d --no-default-features --features gpu,wgpu
          cargo check --locked -p quasar-render-3d --no-default-features --features vulkan
          cargo check --locked -p quasar-render-3d --no-default-features --features opengl
          cargo check --locked -p quasar-window --no-default-features
          cargo check --locked -p quasar-input --no-default-features
          cargo check --locked -p quasar-assets --no-default-features
          cargo check --locked -p quasar-diagnostics --no-default-features
          cargo check --locked -p quasar-app --no-default-features
          cargo check --locked -p quasar-jobs --no-default-features
          cargo check --locked -p quasar-sim --no-default-features
          cargo check --locked -p quasar-config --no-default-features
          cargo check --locked -p quasar-profile --no-default-features
          cargo check --locked -p quasar-spatial --no-default-features
          cargo check --locked -p quasar-physics --no-default-features
          cargo check --locked -p quasar-physics --no-default-features --features dim2
          cargo check --locked -p quasar-physics --no-default-features --features dim3
          cargo check --locked -p quasar-animation --no-default-features
          cargo check --locked -p quasar-nav --no-default-features
          cargo check --locked -p starfall --no-default-features
          cargo check --locked -p falling-sand --no-default-features
          cargo check --locked -p physics-playground --no-default-features
          cargo clippy --locked -p quasar-window --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-sim --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-jobs --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-app --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-assets --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-diagnostics --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p vulkanic-gal --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p vulkanic-gal --all-targets --no-default-features --features opengl -- -D warnings
          cargo clippy --locked -p vulkanic-gal --all-targets --no-default-features --features wgpu -- -D warnings
          cargo clippy --locked -p vulkanic-gal --all-targets --features opengl,wgpu -- -D warnings
          cargo clippy --locked -p vulkanic-gal --all-targets --features opengl,test-support -- -D warnings
          cargo clippy --locked -p quasar-render-2d --all-targets --no-default-features --features gpu -- -D warnings
          cargo clippy --locked -p quasar-render-2d --all-targets --no-default-features --features gpu,opengl -- -D warnings
          cargo clippy --locked -p quasar-render-3d --all-targets --no-default-features --features opengl -- -D warnings

      - name: Verify spatial/physics/nav dependency isolation
        run: |
          cargo tree --locked -p quasar-spatial -e normal | (! grep -Eq 'rapier[23]d|parry[23]d')
          cargo tree --locked -p quasar-physics --no-default-features -e normal | (! grep -Eq 'rapier[23]d|parry[23]d')
          cargo tree --locked -p quasar-physics --no-default-features --features dim2 -e normal | grep -q 'rapier2d'
          ! cargo tree --locked -p quasar-physics --no-default-features --features dim2 -e normal | grep -q 'rapier3d'
          cargo tree --locked -p quasar-physics --no-default-features --features dim3 -e normal | grep -q 'rapier3d'
          ! cargo tree --locked -p quasar-physics --no-default-features --features dim3 -e normal | grep -q 'rapier2d'
          cargo tree --locked -p quasar-nav --no-default-features --features tilemap -e normal | (! grep -Eq 'quasar-render-2d|vulkanic-gal')
          cargo tree --locked -p quasar-animation --features sprite -e normal | (! grep -Eq 'vulkanic-gal|shaderc')
          cargo tree --locked -p quasar-ui -e normal | (! grep -Eq 'quasar-render-2d|vulkanic-gal|quasar-input|quasar-config')
          cargo tree --locked -p quasar-ui --features render2d -e normal | grep -q 'quasar-render-2d'
          cargo tree --locked -p quasar-text -e normal | (! grep -Eq 'quasar-render-2d|vulkanic-gal|quasar-window|quasar-input|quasar-ui')
          cargo tree --locked -p quasar-render-2d -e normal | (! grep -q 'quasar-text')
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
  gpu-composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install software Vulkan and native test dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libxkbcommon-dev libxkbcommon-x11-0 libasound2-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libvulkan-dev mesa-vulkan-drivers xvfb
      - name: Run GPU lifetime and pixel tests
        run: xvfb-run -a cargo test --locked -p quasar-composition -p quasar-render-2d -p tilequest -p vulkanic-gal -p pong --lib -- --include-ignored --test-threads=1

      - name: Test quasar-ui shared-GAL rendering
        run: xvfb-run -a cargo test --locked -p quasar-ui --all-features --test render -- --ignored --test-threads=1

      - name: Run OpenGL backend and cross-backend conformance tests
        run: xvfb-run -a cargo test --locked -p vulkanic-gal --no-default-features --features vulkan,opengl --lib -- --include-ignored --test-threads=1
      - name: Exercise native resize and failed-frame recovery
        run: xvfb-run -a cargo run --locked -p quasar-composition -- --frames 40 --exercise-window
      - name: Exercise native Pong window recovery
        run: xvfb-run -a cargo run --locked -p pong -- --autoplay --no-save --smoke-frames 30 --exercise-window

      - name: Exercise native tilemap window recovery
        run: xvfb-run -a cargo run --locked -p tilequest -- --autoplay --smoke-frames 40 --exercise-window

      - name: Exercise native quasar-app lifecycle
        run: xvfb-run -a cargo run --locked -p quasar-app --example desktop

      - name: Exercise quasar-app headless lifecycle
        run: cargo run --locked -p quasar-app --example desktop -- --headless

      - name: Exercise runner stress harness
        run: |
          cargo run --locked -p app-stress -- --headless --ticks 120
          xvfb-run -a cargo run --locked -p app-stress -- --frames 40 --exercise-window

      - name: Exercise deterministic simulation replay
        run: cargo run --locked -p quasar-sim --example replay

      - name: Exercise Starfall headless replay and screenshot
        run: |
          cargo run --locked -p starfall -- --headless --ticks 120 --record /tmp/starfall.json
          cargo run --locked -p starfall -- --headless --replay /tmp/starfall.json
          cargo run --locked -p starfall -- --headless --ticks 30 --screenshot /tmp/starfall.png

      - name: Test shared 3D+2D Starfall rendering
        run: xvfb-run -a cargo test --locked -p starfall --test render -- --ignored --test-threads=1

      - name: Exercise Starfall benchmark
        run: xvfb-run -a cargo run --locked -p starfall -- --benchmark --benchmark-frames 30 --benchmark-file /tmp/starfall-profile.json

      - name: Exercise Falling Sand headless simulation and screenshot
        run: |
          cargo run --locked -p falling-sand -- --headless --ticks 240 --autoplay
          cargo run --locked -p falling-sand -- --headless --ticks 120 --autoplay --screenshot /tmp/falling-sand.png

      - name: Test Falling Sand shared-GAL rendering
        run: xvfb-run -a cargo test --locked -p falling-sand --test sand -- --ignored --test-threads=1

      - name: Exercise Falling Sand benchmark
        run: xvfb-run -a cargo run --locked -p falling-sand -- --benchmark --benchmark-frames 20 --benchmark-file /tmp/falling-sand-profile.json

      - name: Exercise Physics Playground headless simulation and screenshot
        run: |
          cargo run --locked -p physics-playground -- --headless --ticks 240 --autoplay
          cargo run --locked -p physics-playground -- --headless --ticks 120 --autoplay --screenshot /tmp/physics-playground.png

      - name: Test Physics Playground shared-GAL rendering
        run: xvfb-run -a cargo test --locked -p physics-playground --test playground -- --ignored --test-threads=1

      - name: Exercise Physics Playground benchmark
        run: xvfb-run -a cargo run --locked -p physics-playground -- --benchmark --benchmark-frames 20 --benchmark-file /tmp/physics-playground-profile.json

      - name: Exercise native software-framebuffer presentation
        run: xvfb-run -a cargo run --locked -p framebuffer -- --frames 30 --exercise-window

      - name: Render a headless software-framebuffer screenshot
        run: xvfb-run -a cargo run --locked -p framebuffer -- --headless --screenshot /tmp/framebuffer.png

      - name: Render deterministic offline audio
        run: cargo run --locked -p audio-example -- --offline /tmp/audio-example.wav --benchmark /tmp/audio-benchmark.json
