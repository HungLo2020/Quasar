name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  headless:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libudev for the optional native gamepad check
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo check --locked -p quasar-window --all-targets
      - run: cargo check --locked -p quasar-app --all-targets
      - run: cargo check --locked -p quasar-app --no-default-features --all-targets
      - run: cargo check --locked -p quasar-input --features gilrs
      - run: cargo check --locked -p quasar-assets --features serde,storage
      - run: cargo check --locked -p quasar-assets --features async,hot-reload
      - run: cargo check --locked -p quasar-diagnostics --features timing,serde
      - run: cargo test --locked -p quasar-input -p pong -p quasar-tilemap -p tilequest -p quasar-audio --no-default-features
      - run: cargo test --locked -p quasar-audio --no-default-features --features settings --test settings
      - run: python tools/verify_pong.py
      - run: python tools/verify_tilemap.py
  audio-native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA headers on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - run: cargo check --locked -p quasar-audio --all-features
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libxkbcommon-dev libxkbcommon-x11-0 libasound2-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libvulkan-dev xvfb x11-utils xdotool libudev-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - name: Test optional feature layers
        run: |
          cargo test --locked -p quasar-input --features gilrs,diagnostics
          cargo test --locked -p quasar-assets --features serde,storage,diagnostics
          cargo test --locked -p quasar-assets --features async,hot-reload,serde,storage,diagnostics
          cargo test --locked -p quasar-diagnostics --features timing,serde
          cargo test --locked -p quasar-app
          cargo test --locked -p quasar-app --no-default-features
          cargo check --locked -p quasar-window --features diagnostics
          cargo check --locked -p quasar-audio --features diagnostics
          cargo check --locked -p quasar-frame --features diagnostics
          cargo clippy --locked -p quasar-input --all-targets --features gilrs,diagnostics -- -D warnings
          cargo clippy --locked -p quasar-assets --all-targets --features async,hot-reload,serde,storage,diagnostics -- -D warnings
          cargo clippy --locked -p quasar-diagnostics --all-targets --features timing,serde -- -D warnings
          cargo clippy --locked -p quasar-app --all-targets -- -D warnings
          cargo clippy --locked -p quasar-app --all-targets --no-default-features -- -D warnings
      - name: Run native X11 identity and resize tests
        run: |
          xvfb-run -a sh -c 'QUASAR_X11_TESTS=1 cargo test --locked -p quasar-window --test x11_native -- --test-threads=1'
          xvfb-run -a sh -c 'QUASAR_X11_TESTS=1 cargo test --locked -p quasar-window --features diagnostics --test x11_native -- --test-threads=1'
      - name: Verify native X11 properties with xprop and xdotool
        run: |
          cargo build --locked -p quasar-window --example desktop_identity
          xvfb-run -a python3 tools/x11_window_smoke.py --timeout 15
          xvfb-run -a python3 tools/x11_window_smoke.py --transparent --timeout 15
      - name: Verify DPI-scaled physical metadata
        run: |
          xvfb-run -a env WINIT_X11_SCALE_FACTOR=2 QUASAR_X11_TESTS=1 cargo test --locked -p quasar-window --test x11_native -- --test-threads=1
          xvfb-run -a env WINIT_X11_SCALE_FACTOR=2 python3 tools/x11_window_smoke.py --timeout 15
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p quasar-audio --all-targets --all-features --locked -- -D warnings
      - name: Check backend feature separation
        run: |
          cargo check --locked -p vulkanic-gal --no-default-features
          cargo check --locked -p vulkanic-gal --no-default-features --features vulkan
          cargo check --locked -p vulkanic-gal --no-default-features --features opengl
          cargo check --locked -p quasar-frame --no-default-features
          cargo check --locked -p quasar-render-2d --no-default-features --features gpu
          cargo check --locked -p quasar-render-2d --no-default-features --features gpu,vulkan
          cargo check --locked -p quasar-render-2d --no-default-features --features gpu,opengl
          cargo check --locked -p quasar-render-3d --no-default-features --features vulkan
          cargo check --locked -p quasar-render-3d --no-default-features --features opengl
          cargo check --locked -p quasar-window --no-default-features
          cargo check --locked -p quasar-input --no-default-features
          cargo check --locked -p quasar-assets --no-default-features
          cargo check --locked -p quasar-diagnostics --no-default-features
          cargo check --locked -p quasar-app --no-default-features
          cargo clippy --locked -p quasar-window --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-app --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-assets --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p quasar-diagnostics --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p vulkanic-gal --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p vulkanic-gal --all-targets --no-default-features --features opengl -- -D warnings
          cargo clippy --locked -p quasar-render-2d --all-targets --no-default-features --features gpu -- -D warnings
          cargo clippy --locked -p quasar-render-2d --all-targets --no-default-features --features gpu,opengl -- -D warnings
          cargo clippy --locked -p quasar-render-3d --all-targets --no-default-features --features opengl -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
  gpu-composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install software Vulkan and native test dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libxkbcommon-dev libxkbcommon-x11-0 libasound2-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libvulkan-dev mesa-vulkan-drivers xvfb
      - name: Run GPU lifetime and pixel tests
        run: xvfb-run -a cargo test --locked -p quasar-composition -p quasar-render-2d -p tilequest -p vulkanic-gal -p pong --lib -- --include-ignored --test-threads=1

      - name: Run OpenGL backend and cross-backend conformance tests
        run: xvfb-run -a cargo test --locked -p vulkanic-gal --no-default-features --features vulkan,opengl --lib -- --include-ignored --test-threads=1
      - name: Exercise native resize and failed-frame recovery
        run: xvfb-run -a cargo run --locked -p quasar-composition -- --frames 40 --exercise-window
      - name: Exercise native Pong window recovery
        run: xvfb-run -a cargo run --locked -p pong -- --autoplay --no-save --smoke-frames 30 --exercise-window

      - name: Exercise native tilemap window recovery
        run: xvfb-run -a cargo run --locked -p tilequest -- --autoplay --smoke-frames 40 --exercise-window

      - name: Exercise native quasar-app lifecycle
        run: xvfb-run -a cargo run --locked -p quasar-app --example desktop

      - name: Exercise quasar-app headless lifecycle
        run: cargo run --locked -p quasar-app --example desktop -- --headless

      - name: Exercise native software-framebuffer presentation
        run: xvfb-run -a cargo run --locked -p framebuffer -- --frames 30 --exercise-window

      - name: Render a headless software-framebuffer screenshot
        run: xvfb-run -a cargo run --locked -p framebuffer -- --headless --screenshot /tmp/framebuffer.png

      - name: Render deterministic offline audio
        run: cargo run --locked -p audio-example -- --offline /tmp/audio-example.wav --benchmark /tmp/audio-benchmark.json
